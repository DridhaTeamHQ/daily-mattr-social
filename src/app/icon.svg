  <!--
    App icon: the wordmark's quote pair on the brand fill.

    Reversed to white rather than the black used everywhere else in the app —
    at 16px in a browser tab the black outline and the black glyphs merge into
    one dark blob, and the shape stops being readable. The outline is kept
    because a borderless tile is the one thing that would look imported from a
    different app.
  -->
